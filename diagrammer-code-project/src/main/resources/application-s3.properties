# The s3 profile reads configuration from the environment only.
# There are no properties for credentials. Set these variables (names only):
#   DIAGRAMMER_S3_BUCKET
#   AWS_REGION
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# The AWS SDK default credential provider chain resolves the access key and secret.
# The users object key is auth/users.json.
