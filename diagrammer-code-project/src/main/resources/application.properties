server.port=${PORT:8080}

# The local profile uses the classpath fixture user store so the app starts
# without AWS. Production must set SPRING_PROFILES_ACTIVE=s3.
spring.profiles.default=local

vaadin.launch-browser=false

# /diagrams/** is a public placeholder served by Spring MVC, not the Vaadin shell.
vaadin.exclude-urls=/diagrams/**
logging.level.org.atmosphere=warn
