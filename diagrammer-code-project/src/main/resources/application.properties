# Render sets PORT. Local runs keep 8080 when it is unset.
server.port=${PORT:8080}

# No default profile. The fixture user store is dev-only (local or test).
# A run with no profile fails at startup unless DIAGRAMMER_S3_BUCKET and
# AWS_REGION are set, in which case the s3 profile is activated.
# Local dev: ./mvnw spring-boot:run -Pdev

vaadin.launch-browser=false

# /diagrams/** is a public placeholder. Vaadin must not own the path; the
# servlet filter writes the 404. /actuator/health is the Render probe and
# must reach Spring Boot Actuator rather than the Vaadin servlet.
vaadin.exclude-urls=/diagrams/**,/actuator/health,/actuator/health/**

# Health only, and status only. Other actuator endpoints stay off the web.
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Status only. Do not add the liveness/readiness group list to the body.
management.endpoint.health.probes.enabled=false
logging.level.org.atmosphere=warn
